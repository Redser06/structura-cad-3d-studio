name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: typecheck, lint, test, build, gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # The image is pinned by digest. `gitleaks detect` scans the checkout
      # locally and does not call the hosted gitleaks API (no license, no token).
      - name: Gitleaks
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --redact --verbose --exit-code 1
